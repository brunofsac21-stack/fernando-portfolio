<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cultiva Farm — Demo · Fernando Gregório</title>
<meta name="description" content="Demonstração interativa do Cultiva Farm, plataforma de inteligência agronômica por talhão. Dados fictícios." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  /* Tokens do design system do Cultiva Farm (src/styles/tokens.css) */
  :root {
    --surface: #ffffff; --surface-alt: #f7f8f5; --straw: #f3f5f1; --line: #e3e6e1; --line-soft: #eef0ec;
    --ink: #101413; --ink-muted: #59625c; --ink-subtle: #6b736e;
    --crop: #2f7d32; --crop-ink: #1f5a22; --crop-tint: #e6f2e1;
    --data: #1d3b8f; --data-soft: #a9b7e0; --data-tint: #e3e8f7;
    --warning: #b26a00; --warning-ink: #8a5200; --warning-tint: #fff1d6;
    --critical: #b42318; --critical-ink: #9a1d13; --critical-tint: #fde7e4;
    --deep: #0f1d16; --deep-ink: #c9d3cc;
    --radius-tile: 14px; --radius-card: 18px; --radius-pill: 999px;
    --shadow-float: 0 6px 20px rgba(16,20,19,0.10); --shadow-map: 0 6px 20px rgba(16,20,19,0.18);
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--surface-alt); font-weight: 500; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .wordmark { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .wordmark .light { font-weight: 500; }
  .demo-tag { font-size: 12px; font-weight: 700; color: var(--warning-ink); background: var(--warning-tint); padding: 5px 10px; border-radius: var(--radius-pill); white-space: nowrap; }
  .top .spacer { flex: 1; }
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-pill); text-decoration: none; font-size: 14px; font-weight: 700; background: var(--surface); }
  .back:hover { background: var(--straw); }

  .main { display: grid; grid-template-columns: 1fr 460px; min-height: 0; }
  .map-wrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  .chips { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; overflow-x: auto; z-index: 2; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; min-height: 40px; padding: 0 16px; border-radius: var(--radius-pill); border: none; background: var(--surface); box-shadow: var(--shadow-map); font-size: 14px; font-weight: 700; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--deep); color: #fff; }
  .legend { position: absolute; left: 12px; bottom: 34px; z-index: 2; background: var(--surface); border-radius: var(--radius-tile); box-shadow: var(--shadow-map); padding: 10px 12px; width: 260px; max-width: calc(100% - 24px); }
  .legend select { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-weight: 700; padding: 0 10px; background: var(--surface); }
  .legend .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin: 10px 0 6px; }
  .legend .bar span { height: 10px; border-radius: 3px; }
  .legend .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-muted); font-weight: 600; }
  .lbl { pointer-events: auto; cursor: pointer; background: var(--surface); border: none; border-radius: 10px; padding: 3px 8px; box-shadow: 0 2px 8px rgba(16,20,19,.25); text-align: center; line-height: 1.2; white-space: nowrap; }
  .lbl b { display: block; font-size: 12px; font-weight: 800; }
  .lbl small { display: block; font-size: 11px; font-weight: 700; color: var(--data); }
  .lbl.sel { background: var(--deep); color: #fff; }
  .lbl.sel small { color: var(--data-tint); }
  .maplibregl-ctrl-attrib { font-family: var(--font); font-size: 11px; }

  .panel { background: var(--surface-alt); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 4px; padding: 10px 12px 0; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; min-height: 44px; padding: 0 9px; border: none; background: none; font-size: 13.5px; font-weight: 700; color: var(--ink-muted); border-bottom: 2px solid transparent; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--crop); }
  .content { flex: 1; overflow-y: auto; padding: 16px; }

  .hero { background: var(--deep); color: #fff; border-radius: var(--radius-card); padding: 18px; }
  .over { font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px; }
  .hero .over { color: var(--deep-ink); }
  .big, .hero .big { font-size: 34px; color: inherit; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin: 0; }
  .hero p { margin: 4px 0 0; color: var(--deep-ink); font-size: 14px; }
  .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.14); }
  .hero-stats span { display: block; font-size: 12px; color: var(--deep-ink); }
  .hero-stats b { font-size: 15px; font-weight: 800; }
  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-card); padding: 16px; margin-top: 12px; }
  .card h3 { font-size: 17px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .card h3 .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--crop-tint); color: var(--crop-ink); display: inline-grid; place-items: center; }
  .note { font-size: 12px; color: var(--ink-subtle); margin: 10px 0 0; line-height: 1.45; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-tile); padding: 12px; }
  .stat span { display: block; font-size: 12px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .4px; }
  .stat b { display: block; font-size: 18px; font-weight: 800; margin-top: 4px; }
  .stat small { display: block; font-size: 12px; color: var(--ink-subtle); margin-top: 2px; }
  .rows { margin: 0; }
  .rows div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
  .rows div:first-child { border-top: none; }
  .rows dt { color: var(--ink-muted); }
  .rows dd { margin: 0; font-weight: 700; text-align: right; }
  .rows dd small { display: block; font-weight: 500; color: var(--ink-subtle); }
  .list { list-style: none; margin: 12px 0 0; padding: 0; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-card); overflow: hidden; }
  .list button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border: none; border-top: 1px solid var(--line-soft); background: none; text-align: left; cursor: pointer; font-size: 14px; }
  .list li:first-child button { border-top: none; }
  .list button:hover { background: var(--straw); }
  .list .sub { display: block; font-size: 12px; color: var(--ink-subtle); }
  .segs { display: flex; gap: 6px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
  .seg { flex: none; min-height: 40px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; cursor: pointer; }
  .seg[aria-pressed="true"] { background: var(--deep); color: #fff; border-color: var(--deep); }
  .barlist { margin-top: 8px; }
  .barrow { position: relative; margin-top: 8px; }
  .barrow .track { position: relative; height: 34px; }
  .barrow .fill { position: absolute; inset: 0 auto 0 0; background: var(--data-soft); border-radius: 6px; }
  .barrow .avg { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--ink); }
  .barrow .name { position: absolute; left: 10px; top: 0; line-height: 34px; font-size: 14px; font-weight: 700; }
  .barrow .val { position: absolute; right: 0; top: 0; line-height: 34px; font-size: 14px; font-weight: 800; }
  .barrow .meta { font-size: 12px; color: var(--ink-subtle); margin-top: 2px; }
  .barlist .track-wrap { margin-right: 92px; position: relative; }
  .keys { display: flex; gap: 14px; font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
  .keys i { display: inline-block; width: 12px; height: 10px; border-radius: 3px; background: var(--data-soft); margin-right: 5px; vertical-align: -1px; }
  .keys .dash { width: 14px; height: 0; border-top: 2px dashed var(--ink); border-radius: 0; background: none; vertical-align: 3px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); }
  .status.ok { color: var(--crop-ink); background: var(--crop-tint); }
  .status.warning { color: var(--warning-ink); background: var(--warning-tint); }
  .status.critical { color: var(--critical-ink); background: var(--critical-tint); }
  .item { padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .item:first-of-type { border-top: none; padding-top: 2px; }
  .item b { display: block; font-size: 15px; margin-top: 6px; }
  .item span.sub { font-size: 12px; color: var(--ink-subtle); }
  .hl { border-radius: var(--radius-tile); padding: 12px; margin-top: 8px; font-size: 14px; background: var(--straw); }
  .hl.good { background: var(--crop-tint); }
  .hl.warn { background: var(--warning-tint); }
  .hl b { display: block; }
  .hl small { display: block; color: var(--ink-subtle); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 4px; border-top: 1px solid var(--line-soft); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 12px; color: var(--ink-muted); font-weight: 700; border-top: none; }
  .neg { color: var(--critical-ink); }
  svg text { font-family: var(--font); }
  .empty { text-align: center; padding: 30px 12px; color: var(--ink-muted); }
  .classes { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0 6px; background: var(--line-soft); }
  .about { font-size: 13px; color: var(--ink-muted); line-height: 1.55; }
  .about ul { padding-left: 18px; margin: 8px 0 0; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--straw); margin: 4px 4px 0 0; }

  /* #capa: só o mapa, para a imagem de capa do portfólio */
  .capa .top, .capa .panel, .capa .maplibregl-ctrl-bottom-right, .capa .legend { display: none !important; }
  .capa .main { grid-template-columns: 1fr; }
  .capa .map-wrap { height: 450px; }
  .capa .main { min-height: 0; } .capa .app { height: auto; }
  @media (max-width: 900px) {
    .app { height: auto; min-height: 100dvh; }
    .main { grid-template-columns: 1fr; }
    .map-wrap { height: 52vh; min-height: 340px; }
    .panel { border-left: none; }
    .content { overflow: visible; }
    .demo-tag { display: none; }
    .legend { bottom: 30px; }
  }
  @media (max-width: 420px) { .back span { display: none; } }
</style>
</head>

<div class="app">
  <header class="top">
    <span class="wordmark" aria-label="Cultiva Farm">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M18.36 5.64A9 9 0 1 0 18.36 18.36" /><path d="M16.24 7.76A6 6 0 1 0 16.24 16.24" stroke="#2f7d32" /><path d="M14.12 9.88A3 3 0 1 0 14.12 14.12" stroke="#2f7d32" /><circle cx="19.2" cy="12" r="1.6" fill="#2f7d32" stroke="none" />
      </svg>
      <span aria-hidden="true">Cultiva <span class="light">Farm</span></span>
    </span>
    <span class="demo-tag">Demonstração · fazenda e dados fictícios</span>
    <span class="spacer"></span>
    <a class="back" href="/" aria-label="Voltar ao portfólio">← <span>Portfólio</span></a>
  </header>

  <div class="main">
    <section class="map-wrap" aria-label="Mapa da fazenda">
      <div id="map"></div>
      <div class="chips" role="group" aria-label="O que mostrar nos talhões">
        <button type="button" class="chip" data-mode="name" aria-pressed="true">Nome</button>
        <button type="button" class="chip" data-mode="season" aria-pressed="false">Safra e cultivar</button>
        <button type="button" class="chip" data-mode="yield" aria-pressed="false">Produtividade</button>
      </div>
      <div class="legend" id="legend" hidden>
        <label class="over" for="yieldSel" style="display:block">Colheita</label>
        <select id="yieldSel"></select>
        <div class="bar" id="legendBar"></div>
        <div class="scale" id="legendScale"></div>
      </div>
    </section>

    <aside class="panel">
      <nav class="tabs" role="tablist" aria-label="Seções">
        <button type="button" class="tab" role="tab" data-tab="farm" aria-selected="true">Fazenda</button>
        <button type="button" class="tab" role="tab" data-tab="field" aria-selected="false">Talhão</button>
        <button type="button" class="tab" role="tab" data-tab="yield" aria-selected="false">Produtividade</button>
        <button type="button" class="tab" role="tab" data-tab="finance" aria-selected="false">Financeiro</button>
        <button type="button" class="tab" role="tab" data-tab="licenses" aria-selected="false">Licenças</button>
      </nav>
      <div class="content" id="content" role="tabpanel"></div>
    </aside>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

function split(amount, w) {

    // Como no app: com cores de produtividade o preenchimento fica quase opaco.
    const sel = ["boolean", ["feature-state", "sel"], false];
    map.setPaintProperty("f-fill", "fill-opacity", state.mode === "yield" ? ["case", sel, 0.92, 0.78] : ["case", sel, 0.55, 0.3]);
  }
  for (const { f, el } of markers) {
    let second = "";
    if (state.mode === "season") {
      const c = current(f);
      if (c) { const dap = c.planting && c.planting <= TODAY ? `${days(c.planting, TODAY)} DAP` : "plantio previsto"; second = `${c.crop} · ${c.cultivar || "sem cultivar"} · ${dap}`; }
      else second = "sem safra";
    } else if (state.mode === "yield") {
      const r = layer && layer.by.get(f.name); second = r ? sc(r.y) : "sem colheita";
    }
    el.innerHTML = `<b>${esc(f.name)}</b>${second ? `<small>${esc(second)}</small>` : ""}`;
    el.classList.toggle("sel", state.field === f.name);
    el.setAttribute("aria-label", `${f.name}${second ? ", " + second : ""}. Abrir ficha`);
  }
  const legend = document.getElementById("legend");
  legend.hidden = state.mode !== "yield";
  if (layer) {
    document.getElementById("legendBar").innerHTML = RAMP.map((c) => `<span style="background:${c}"></span>`).join("");
    document.getElementById("legendScale").innerHTML = `<span>${n1.format(layer.min)}</span><span>média ${sc(layer.avg)}</span><span>${n1.format(layer.max)}</span>`;
  }
  fields.forEach((f) => map.getSource("fields") && map.setFeatureState({ source: "fields", id: f.idx }, { sel: state.field === f.name }));
}

const sel = document.getElementById("yieldSel");
sel.innerHTML = yieldOptions.map((o) => `<option value="${esc(o.crop + "|" + o.season)}">${esc(o.crop)} ${esc(o.season)}</option>`).join("");
sel.value = state.yieldKey;
sel.addEventListener("change", () => { state.yieldKey = sel.value; paintMap(); });
document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
  state.mode = b.dataset.mode;
  document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  paintMap();
}));

function selectField(name) {
  state.field = name; paintMap(); setTab("field");
  const f = byName.get(name); map.easeTo({ center: f.center, duration: 500 });
}

// ---------------------------------------------------------------- abas
function setTab(t) {
  state.tab = t;
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.tab === t)));
  render();
  document.getElementById("content").scrollTop = 0;
}
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
document.getElementById("content").addEventListener("click", (e) => {
  const f = e.target.closest("[data-field]"); if (f) return selectField(f.dataset.field);
  const t = e.target.closest("[data-go]"); if (t) return setTab(t.dataset.go);
  const c = e.target.closest("[data-crop]"); if (c) { state.prodCrop = c.dataset.crop; state.prodSeason = null; return render(); }
  const s = e.target.closest("[data-season]"); if (s) { state.prodSeason = s.dataset.season; return render(); }
});

const ICON = {
  sprout: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>',
  satellite: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg>',
  flask: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg>',
};
const IRR = { pivo: "Pivô central", outro: "Irrigado" };
const stat = (label, value, small) => `<div class="stat"><span>${esc(label)}</span><b>${value}</b>${small ? `<small>${small}</small>` : ""}</div>`;
const row = (dt, dd, small) => `<div><dt>${esc(dt)}</dt><dd>${dd}${small ? `<small>${small}</small>` : ""}</dd></div>`;

function renderFarm() {
  const p = DATA.property;
  const soja = yieldOptions.find((o) => o.crop === "Soja"); const L = soja && yieldLayer("Soja", soja.season);
  const cur = fields.map(current).filter(Boolean);
  const cultivars = [...new Set(cur.map((c) => c.cultivar).filter(Boolean))];
  return `
  <div class="hero">
    <p class="over">${esc(p.name)} · ${esc(p.municipality)}/${esc(p.state)}</p>
    <p class="big">${ha(Number(p.area_ha))}</p>
    <p>Área da fazenda pelo limite do imóvel</p>
    <div class="hero-stats">
      <div><span>Mapeado</span><b>${n0.format(mappedHa)} ha</b></div>
      <div><span>Talhões</span><b>${fields.length} pivôs</b></div>
      <div><span>Safra atual</span><b>${esc(cur[0] ? cur[0].crop + " " + cur[0].season : "—")}</b></div>
    </div>
  </div>
  <div class="grid2">
    ${L ? stat(`Soja ${L.season}`, sc(L.avg), "média ponderada pela área") : ""}
    ${stat("Pendências", `${pendings.length ? MARK[pendings[0].st.tone] + " " + pendings.length : "● 0"}`, pendings.length ? "licenças e condicionantes" : "tudo em dia")}
  </div>
  <div class="card">
    <h3>Safra ${esc(cur[0] ? cur[0].season : "")} no campo</h3>
    <p style="margin:0;font-size:14px;color:var(--ink-muted)">${cur.length} talhões plantados com ${cultivars.length} cultivares: ${esc(cultivars.join(", "))}.</p>
    <p class="note">No mapa, escolha "Safra e cultivar" para ver cada pivô, ou "Produtividade" para comparar colheitas.</p>
  </div>
  <ul class="list" aria-label="Talhões">
    ${fields.map((f) => { const c = current(f); return `<li><button type="button" data-field="${esc(f.name)}"><span><b>${esc(f.name)}</b><span class="sub">${c ? esc(`${c.crop} · ${c.cultivar || "sem cultivar"}`) : "sem safra"}</span></span><span>${ha(f.area)} ›</span></button></li>`; }).join("")}
  </ul>
  ${renderAbout()}`;
}

function columnChart(points, avgLine) {
  // Colunas finas na cor de dados, grade tracejada só na horizontal (src/components/charts).
  const W = 380, H = 170, pad = { l: 34, r: 8, t: 12, b: 28 };
  const vals = points.map((p) => p.v); const top = Math.ceil(Math.max(...vals, avgLine || 0) / 20) * 20 || 20;
  const step = (W - pad.l - pad.r) / points.length, bw = Math.min(28, step * 0.5);
  const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  const grid = [0, top / 2, top].map((v) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e6e1" stroke-dasharray="3 3"/><text x="${pad.l - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#6b736e">${n0.format(v)}</text>`).join("");
  const bars = points.map((p, i) => { const x = pad.l + step * i + (step - bw) / 2; return `<g><title>${esc(p.label)}: ${sc(p.v)}</title><rect x="${x}" y="${y(p.v)}" width="${bw}" height="${y(0) - y(p.v)}" rx="4" fill="#1d3b8f"/><text x="${x + bw / 2}" y="${H - 10}" font-size="11" text-anchor="middle" fill="#59625c">${esc(p.short)}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Produtividade por safra">${grid}${bars}</svg>`;
}

function renderField() {
  if (!state.field) return `<div class="empty"><p style="font-size:17px;font-weight:700;color:var(--ink)">Escolha um talhão</p><p>Toque num pivô no mapa ou na lista da fazenda para abrir a ficha.</p><button type="button" class="seg" data-go="farm">Ver lista de talhões</button></div>`;
  const f = byName.get(state.field); const c = current(f);
  const dap = c && c.planting && c.planting <= TODAY ? days(c.planting, TODAY) : null;
  const hist = f.seasons.filter((s) => s.crop === "Soja" && s.yield !== null);
  const pts = hist.map((s) => ({ label: `Soja ${s.season}`, short: s.season.replace(/^20/, ""), v: s.yield }));
  const last = hist[hist.length - 1]; const L = last && yieldLayer("Soja", last.season);
  const s = f.soil, nd = f.ndvi;
  const classes = nd && nd.bins ? nd.bins.map((v, i) => `<span style="width:${v * 100}%;background:${["#c8b99a", "#d9e6c8", "#9cc58a", "#5a9a4c", "#1f5a22"][i]}"></span>`).join("") : "";
  return `
  <p class="over">Ficha do talhão</p>
  <h2 style="font-size:26px;margin:0;font-weight:800;letter-spacing:-.5px">${esc(f.name)}</h2>
  <p style="margin:2px 0 0;color:var(--ink-muted);font-size:14px">${esc(DATA.property.name)}${c ? ` · ${esc(c.crop)} ${esc(c.season)}` : ""}</p>
  <div class="grid2">
    ${stat("Área", ha(f.area), `perímetro ${n2.format(f.perimeter_m / 1000)} km`)}
    ${stat("Irrigação", IRR[f.irrigation] || "Sequeiro")}
    ${stat("Plantio", c && c.planting ? dateBr(c.planting) : "—", dap !== null ? `${dap} dias após o plantio` : c && c.planting ? "previsto" : "")}
    ${stat("Safra", c ? esc(c.season) : "—", c ? esc(c.crop) : "")}
  </div>
  ${c ? `<div class="card"><h3><span class="ic">${ICON.sprout}</span>${esc(c.crop)} ${esc(c.season)}</h3><dl class="rows">
    ${row("Cultivar", esc(c.cultivar || "Não informada"), esc(c.tech || ""))}
    ${row("Lote", esc(c.lot || "Não informado"), c.germ ? `germinação ${n0.format(c.germ)}% · vigor ${n0.format(c.vigor)}%` : "")}
    ${row("Colheita", "Em andamento", dap !== null ? `${dap} dias após o plantio` : "")}
  </dl></div>` : ""}
  ${pts.length ? `<div class="card"><h3>Produtividade da soja</h3>${columnChart(pts)}
    ${L ? `<p class="note">Última colheita (${esc(last.season)}): <b>${sc(last.yield)}</b>, ${signed(last.yield - L.avg)} sc/ha da média da fazenda (${sc(L.avg)}).</p>` : ""}
    <details style="margin-top:8px;font-size:13px"><summary style="cursor:pointer;font-weight:700">Ver os números</summary><table><tr><th>Safra</th><th>sc/ha</th></tr>${pts.map((p) => `<tr><td>${esc(p.label)}</td><td>${n1.format(p.v)}</td></tr>`).join("")}</table></details></div>` : ""}
  ${nd ? `<div class="card"><h3><span class="ic">${ICON.satellite}</span>Saúde da lavoura</h3><dl class="rows">${row("NDVI médio", n2.format(nd.mean), `Sentinel-2 · ${dateBr(nd.at)}`)}</dl>
    <div class="classes" aria-hidden="true">${classes}</div>
    <p class="note">Área por classe de vigor, da palha ao vigor muito alto. Com ${dap ?? "poucos"} dias de plantio, o vigor baixo é esperado. Imagem: Copernicus Sentinel-2, nuvens removidas pela máscara SCL.</p></div>` : ""}
  ${s ? `<div class="card"><h3><span class="ic">${ICON.flask}</span>Análise de solo</h3><dl class="rows">
    ${row("V%", `${n1.format(s.v)}%`, "saturação por bases (calculada no banco)")}
    ${row("pH (CaCl₂)", n1.format(s.ph))}
    ${row("CTC", `${n2.format(s.ctc)} cmolc/dm³`)}
    ${row("P (Mehlich)", `${n1.format(s.p)} mg/dm³`)}
    ${row("Argila", `${n0.format(s.clay)}%`)}
  </dl><p class="note">${esc(s.lab)} · ${dateBr(s.sampled_on)} · ${esc(s.depth)}. No app, a calagem sai de fórmula em código a partir do laudo, com o método na tela.</p></div>` : ""}`;
}

function renderYield() {
  const cropsList = [...new Set(yieldOptions.map((o) => o.crop))].sort((a, b) => (a === "Soja" ? -1 : b === "Soja" ? 1 : a.localeCompare(b)));
  const seasonsList = yieldOptions.filter((o) => o.crop === state.prodCrop).map((o) => o.season);
  const season = state.prodSeason || seasonsList[0];
  const L = yieldLayer(state.prodCrop, season);
  const rows = [...L.by.entries()].map(([name, r]) => ({ name, ...r, f: byName.get(name) })).sort((a, b) => b.y - a.y);
  const max = Math.max(...rows.map((r) => r.y));
  const trend = seasonsList.slice().reverse().map((s) => { const l = yieldLayer(state.prodCrop, s); return { label: `${state.prodCrop} ${s}`, short: s.replace(/^20/, "").replace("ª safra ", ""), v: l.avg }; });
  return `
  <div class="hero">
    <p class="over">${esc(DATA.property.name)} · ${esc(state.prodCrop)} ${esc(season)}</p>
    <p class="big">${sc(L.avg)}</p>
    <p>Média ponderada pela área de cada talhão</p>
    <div class="hero-stats">
      <div><span>Produção</span><b>${n0.format(L.production)} sc</b></div>
      <div><span>Área</span><b>${ha(L.area)}</b></div>
      <div><span>Talhões</span><b>${L.count}</b></div>
    </div>
  </div>
  <div class="segs" role="group" aria-label="Cultura">${cropsList.map((c) => `<button type="button" class="seg" data-crop="${esc(c)}" aria-pressed="${c === state.prodCrop}">${esc(c)}</button>`).join("")}</div>
  <div class="segs" role="group" aria-label="Safra">${seasonsList.map((s) => `<button type="button" class="seg" data-season="${esc(s)}" aria-pressed="${s === season}">${esc(s)}</button>`).join("")}</div>
  <div class="card">
    <h3>Talhões em ${esc(season)}</h3>
    <div class="keys"><span><i></i>Talhão</span><span><i class="dash"></i>Média: ${sc(L.avg)}</span></div>
    <div class="barlist">${rows.map((r) => `
      <div class="barrow"><div class="track-wrap"><div class="track"><div class="fill" style="width:${(r.y / max) * 100}%"></div><div class="avg" style="left:${(L.avg / max) * 100}%"></div><span class="name">${esc(r.name)}</span></div></div><span class="val">${n1.format(r.y)}</span>
      <div class="meta">${esc(r.f.seasons.find((s) => s.crop === state.prodCrop && s.season === season).cultivar || "")} · ${ha(r.f.area)} · ${signed(r.vs)} sc/ha da média</div></div>`).join("")}
    </div>
  </div>
  <div class="card"><h3>Evolução da média</h3>${columnChart(trend)}
    <details style="margin-top:8px;font-size:13px"><summary style="cursor:pointer;font-weight:700">Ver os números</summary><table><tr><th>Safra</th><th>sc/ha</th></tr>${trend.map((p) => `<tr><td>${esc(p.label)}</td><td>${n1.format(p.v)}</td></tr>`).join("")}</table></details>
  </div>`;
}

function renderFinance() {
  const crop = "Soja", season = [...new Set((DATA.sales || []).filter((s) => s.crop === crop).map((s) => s.season))].sort().pop();
  if (!season) return `<div class="empty">Sem lançamentos financeiros.</div>`;
  const F = finance(crop, season), T = F.totals;
  const byCost = [...F.rows].sort((a, b) => b.perHa - a.perHa);
  const allPositive = F.rows.every((r) => r.margin > 0);
  return `
  <div class="hero">
    <p class="over">Fechamento · ${crop} ${season}</p>
    <p class="big">${brl0.format(T.margin)}</p>
    <p>Margem da safra (receita − custos, royalties e impostos)</p>
    <div class="hero-stats">
      <div><span>Receita</span><b>${brl0.format(T.revenue)}</b></div>
      <div><span>Custo/ha</span><b>${brl0.format(T.perHa)}</b></div>
      <div><span>Custo/saca</span><b>${brl0.format(T.perBag)}</b></div>
    </div>
  </div>
  <div class="card"><h3>Destaques</h3>
    <div class="hl"><b>Maior custo por hectare: ${esc(byCost[0].name)}</b>${brl0.format(byCost[0].perHa)}/ha, contra ${brl0.format(byCost[byCost.length - 1].perHa)}/ha em ${esc(byCost[byCost.length - 1].name)}.<small>Fonte: custos, royalties e vendas lançados (rateio do app)</small></div>
    ${allPositive ? `<div class="hl good"><b>● Todos os talhões com receita deram margem positiva</b>${F.rows.length} talhões com venda rateada.<small>Fonte: vendas rateadas pela produção (sc/ha × área)</small></div>` : ""}
    <p class="note">Gerados por regras a partir do que está registrado. Não são recomendação técnica.</p>
  </div>
  <div class="card"><h3>Composição</h3><dl class="rows">
    ${row("Custos de produção", brl0.format(T.costs))}${row("Royalties", brl0.format(T.royalty))}${row("Impostos (Funrural, Senar, ITR)", brl0.format(T.taxes), "pela alíquota informada; o app nunca escolhe a alíquota")}${row("Total", brl0.format(T.total))}
  </dl></div>
  <div class="card"><h3>Por talhão</h3>
    <table><tr><th>Talhão</th><th>Custo/ha</th><th>Margem</th></tr>
    ${F.rows.map((r) => `<tr><td>${esc(r.name)}</td><td>${brl0.format(r.perHa)}</td><td class="${r.margin < 0 ? "neg" : ""}">${brl0.format(r.margin)}</td></tr>`).join("")}</table>
    <p class="note">Custos da propriedade rateados pela área (PostGIS); vendas e tributos pela produção. Valores fictícios.</p>
  </div>`;
}

function renderLicenses() {
  const items = DATA.licenses.map((l) => ({ l, st: licenseStatus(l.valid_until, l.lead) })).sort((a, b) => TONE[a.st.tone] - TONE[b.st.tone] || a.st.u - b.st.u);
  return `
  <div class="hero">
    <p class="over">Pendências ambientais</p>
    <p class="big">${pendings.length}</p>
    <p>${pendings.length ? `${MARK[pendings[0].st.tone]} ${pendings.filter((p) => p.st.tone === "warning").length} para atenção` : "● Tudo em dia"}</p>
  </div>
  ${pendings.length ? `<div class="card"><h3>O que fazer</h3>${pendings.map((p) => `<div class="item"><span class="status ${p.st.tone}">${MARK[p.st.tone]} ${esc(p.st.label)}</span><b>${esc(p.what)}</b><span class="sub">${esc(p.sub)}</span></div>`).join("")}</div>` : ""}
  <div class="card"><h3>Todas as licenças</h3>${items.map(({ l, st }) => `<div class="item"><span class="status ${st.tone}">${MARK[st.tone]} ${esc(st.label)}</span><b>${esc(l.number)}</b><span class="sub">${esc(LICENSE_LABEL[l.type] || l.type)} · ${esc(l.issuer)} · emitida em ${dateBr(l.issued_on)}</span>
    ${(l.conditions || []).map((c) => { const cs = conditionStatus(c.due_on, c.done_on); return `<div style="margin-top:8px;font-size:13px"><span class="status ${cs.tone}">${MARK[cs.tone]} ${esc(cs.label)}</span> ${esc(c.description)}${c.recurrence ? ` <span class="sub">(a cada ${c.recurrence} ${c.recurrence === 1 ? "mês" : "meses"})</span>` : ""}</div>`; }).join("")}</div>`).join("")}
    <p class="note">Status: ■ vencida ou prazo de renovação perdido, ▲ até 30 dias do prazo, ● em dia. Antecedência da licença de operação: 120 dias (CONAMA 237/1997, art. 18, § 4).</p>
  </div>`;
}

function renderAbout() {
  return `
  <div class="card"><h3>Sobre o Cultiva Farm</h3>
    <div class="about"><p style="margin:0">Memória digital da fazenda, organizada por talhão. O mapa de satélite é o centro: dele saem a ficha do talhão, a safra, a produtividade, o clima e o vigor da lavoura.</p>
    <ul>
      <li>Talhões desenhados no mapa ou importados (KML/GeoJSON); área e perímetro calculados no PostGIS.</li>
      <li>Safras, cultivares, lotes e tratamento de sementes, com completude do lote.</li>
      <li>Biblioteca de documentos com busca e assistente de IA que sempre cita documento, página e data.</li>
      <li>Laudo de solo lido do PDF e calagem por fórmula em código. Sem receita de defensivos nem adubação.</li>
      <li>Clima por talhão, balanço hídrico nos pivôs, NDVI do Sentinel-2, limite da fazenda pelo CAR.</li>
      <li>Custos, royalties e impostos por talhão; relatórios da safra e fechamento financeiro em PDF.</li>
      <li>Controle de acesso por perfil (RLS) e auditoria de toda alteração.</li>
    </ul></div>
    <div style="margin-top:10px">${["Next.js 16", "TypeScript", "Supabase", "PostGIS", "pgvector", "MapLibre", "Claude API", "Sentinel-2"].map((s) => `<span class="pill">${s}</span>`).join("")}</div>
    <p class="note">Esta página é uma demonstração estática: os dados da Fazenda Santa Aurora (fictícia) estão embutidos nela e as regras de produtividade, rateio e prazos são as mesmas do app. O app real roda com login, banco Supabase e políticas de acesso. Data da demonstração: ${dateBr(TODAY)}.</p>
  </div>`;
}

function render() {
  const el = document.getElementById("content");
  el.innerHTML = { farm: renderFarm, field: renderField, yield: renderYield, finance: renderFinance, licenses: renderLicenses }[state.tab]();
}
render();
</script>
